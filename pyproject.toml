[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsvp-streamer"
version = "0.1.0"
description = "Stream text using rapid serial visual presentation (RSVP)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elias Persson", email = "elias@familjenpersson.se" }]
keywords = ["rsvp", "speed-reading", "reading", "text", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

# These render on the PyPI sidebar:
[project.urls]
Homepage = "https://github.com/eliape/rsvp-streamer"
Repository = "https://github.com/eliape/rsvp-streamer"
Issues = "https://github.com/eliape/rsvp-streamer/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rsvp-streamer = "rsvp_streamer.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rsvp_streamer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
